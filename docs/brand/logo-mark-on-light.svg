    <circle cx="22" cy="17" r="9"/>
    <path d="M30.5 13.8 L39 17 L30.5 20.2 Z"/>
    <path d="M19 25.5 C25.5 27.5 29.5 34 28.5 42 C27.5 49.5 22.5 55 15 57 C12.5 48 13.5 33 19 25.5 Z"/>
  </g>
  <!-- 小鸟（湖水蓝）：向左回望，与大鸟相向依偎 -->
  <g fill="#2f6e8f">
    <circle cx="46" cy="28" r="7"/>
    <path d="M39.4 25.6 L32 28 L39.4 30.4 Z"/>
    <path d="M48.5 34.5 C43.5 36.5 40.5 41.5 41.5 48 C42.3 53.5 45.5 57.5 50.5 59 C53 51.5 52 40.5 48.5 34.5 Z"/>
