<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="拾光 双鸟相伴标志 浅底版">
  <rect width="64" height="64" rx="14" fill="#fbf8f2"/>
  <!-- 大鸟（玉石绿）：头大、身收，小尺寸下靠圆头认出是鸟 -->
